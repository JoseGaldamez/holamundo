<ion-card>
  <ion-card-header class="ion-text-left">
    <img
      src="https://st3.depositphotos.com/12674628/15868/i/450/depositphotos_158688566-stock-photo-happy-family-jumping-on-meadow.jpg"
      alt="Ionic logo" />
    <ion-card-title>{{ title }}</ion-card-title>
    <ion-card-subtitle>{{ date }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content class="ion-text-left">
    <p>
      Here's a small text description for the card content. Nothing more, nothing less.
    </p>
    <ion-row>
      <ion-col>
        <app-like-button></app-like-button>
      </ion-col>
      <ion-col>
        <app-comment></app-comment>
      </ion-col>
    </ion-row>
  </ion-card-content>
</ion-card>
